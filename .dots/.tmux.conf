set -sg escape-time 10
set-option -g default-shell "/usr/bin/zsh"

set -g terminal-overrides ',xterm-kitty:Tc'
set -g default-terminal "xterm-kitty"
set -as terminal-overrides ',xterm*:sitm=\E[3m'

set-option -g mouse on
set-option -s set-clipboard off
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"


set -g status-style "bg=#ccd0da,fg=#4c4f69"
set -g window-status-current-style "bg=#8839ef,fg=#eff1f5,bold"
set -g window-status-style "bg=#ccd0da,fg=#4c4f69"
set -g message-style "bg=#eff1f5,fg=#4c4f69"
